[package]
name = "okf"
version = "0.0.1"
edition = "2024"

[dependencies]
axum = "0.8.9"
tokio = { version = "1.52.3", features = ["full"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_yaml = "0.9.34"
serde_json = "1.0.150"
thiserror = "2.0.18"
tower = "0.5.3"
tower-http = { version = "0.7.0", features = ["trace"] }
anyhow = "1.0.103"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
